<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salida Touch Limpia · Krea Vision Lab</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000000;
        width: 100vw;
        height: 100vh;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100vw !important;
        height: 100vh !important;
        touch-action: none;
        cursor: crosshair;
      }
      /* Barra superior de selección y estado de pantalla */
      .screen-bar {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(56, 189, 248, 0.35);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        padding: 5px 10px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
        z-index: 9999;
        transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s ease;
      }
      .screen-bar.fade-out {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(-12px);
      }
      .screen-bar-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.65rem;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: 0.8px;
        padding-left: 4px;
      }
      .pill-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #cbd5e1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .pill-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }
      .pill-btn.active {
        background: linear-gradient(135deg, #06b6d4, #0284c7);
        border-color: #38bdf8;
        color: #ffffff;
        font-weight: 700;
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
      }
      .screen-status-toast {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #38bdf8;
        padding: 5px 12px;
        border-radius: 6px;
        font-family: ui-monospace, monospace;
        font-size: 0.65rem;
        font-weight: 600;
        z-index: 9999;
        pointer-events: none;
        opacity: 1;
        transition: opacity 1s ease;
      }
      .screen-status-toast.fade-out {
        opacity: 0;
      }
      /* Botón de pantalla completa sutil */
      .fullscreen-btn {
        position: fixed;
        bottom: 15px;
        right: 15px;
        background: rgba(15, 23, 42, 0.4);
        color: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.65rem;
        padding: 5px 9px;
        cursor: pointer;
        z-index: 9999;
        transition: all 0.2s ease;
      }
      .fullscreen-btn:hover {
        background: rgba(15, 23, 42, 0.9);
        color: #ffffff;
        border-color: rgba(56, 189, 248, 0.6);
      }
    </style>
    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>
  <body>
    <!-- Barra superior para seleccionar/ver canal de esta pantalla (se desvanece sola) -->
    <div id="screen-bar" class="screen-bar">
      <span class="screen-bar-label">PANTALLA:</span>
      <button class="pill-btn" data-screen="0">★ Auto (Master)</button>
      <button class="pill-btn" data-screen="1">P1 (Fotos)</button>
      <button class="pill-btn" data-screen="2">P2 (Cámara)</button>
      <button class="pill-btn" data-screen="3">P3 (Video)</button>
      <button class="pill-btn" data-screen="4">P4 (Fusión)</button>
    </div>
    <div id="screen-status-toast" class="screen-status-toast">CONECTADA AL MASTER</div>

    <button id="btn-fs" class="fullscreen-btn" title="Pantalla Completa (F11)">Full</button>

    <script src="output.js"></script>
  </body>
</html>
